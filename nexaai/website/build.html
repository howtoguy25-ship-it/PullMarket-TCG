<title>NexaAi Build</title>
<link rel="stylesheet" href="./style.css" />
<link rel="icon" type="image/png" href="./favicon.png" />
<div class="wrap build-wrap">
  <div class="nav">
    <span class="brand"><img src="./favicon.png" alt="" style="width:20px;height:20px;vertical-align:middle;margin-right:6px;border-radius:5px" />NexaAi</span>
    <a class="active" href="./build.html">Build</a>
    <a href="./credits.html">Credits</a>
    <a href="./settings.html">Settings</a>
    <a href="./connectors.html">Connectors</a>
    <a href="./mcp.html">MCP</a>
    <a href="./apikeys.html">Developer</a>
    <a href="#" id="logout">Log out</a>
  </div>

  <div class="build-header">
    <h1>Build</h1>
    <h2>The same Projects + real streaming chat as the app — build a site/app from web, not just manage the account.</h2>
  </div>

  <div class="build-layout">
    <div class="card">
      <p class="panel-title">Projects</p>
      <div class="new-project-form">
        <input id="newProjectTitle" placeholder="e.g. Portfolio site" />
        <button id="createProjectBtn">
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
          New
        </button>
      </div>
      <div id="projectList" class="project-list"></div>
    </div>

    <div class="card chat-panel-card">
      <div class="chat-panel-header" id="chatPanelHeader">
        <span class="dot"></span>
        <span class="name" id="chatPanelName">No project selected</span>
      </div>
      <div id="chatMessages" class="chat-messages">
        <p class="empty-hint" id="emptyHint">Create or pick a project on the left, then describe what you want to build.</p>
      </div>
      <div class="chat-input-row">
        <textarea id="chatInput" placeholder="Describe what to build or change…" disabled></textarea>
        <button id="sendBtn" disabled>
          Send
          <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="22" y1="2" x2="11" y2="13"/><polygon points="22 2 15 22 11 13 2 9 22 2"/></svg>
        </button>
      </div>
    </div>
  </div>
  <p class="error" id="error" style="display:none"></p>
</div>
<script src="./api.js"></script>
<script>
  requireLoginOrRedirect();

  let projects = [];
  let currentProjectId = null;
  let currentSessionId = null;
  let sending = false;

  const messagesEl = document.getElementById("chatMessages");
  const emptyHint = document.getElementById("emptyHint");
  const inputEl = document.getElementById("chatInput");
  const sendBtn = document.getElementById("sendBtn");
  const errorEl = document.getElementById("error");
  const panelHeaderEl = document.getElementById("chatPanelHeader");
  const panelNameEl = document.getElementById("chatPanelName");

  const CHEVRON = `<svg class="chevron" width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>`;

  function showError(msg) {
    errorEl.textContent = msg;
    errorEl.style.display = "block";
  }

  // Renders a plain-text segment's real markdown-ish structure (CODE_BUILD_FORMAT's
  // "**Title**" heading lines and inline **bold**) as real elements instead
  // of literal asterisks — mirrors the mobile app's FormattedAnswer.
  function renderPlainText(container, text) {
    text.split("\n").forEach((line, i) => {
      if (i > 0) container.appendChild(document.createElement("br"));
      const trimmed = line.trim();
      const headingMatch = trimmed.match(/^\*\*(.+)\*\*$/);
      if (headingMatch) {
        const strong = document.createElement("strong");
        strong.style.cssText = "display:block;margin-top:6px;color:var(--accent-bright);";
        strong.textContent = headingMatch[1];
        container.appendChild(strong);
        return;
      }
      const parts = line.split(/\*\*(.+?)\*\*/g);
      parts.forEach((part, j) => {
        if (j % 2 === 1) {
          const strong = document.createElement("strong");
          strong.textContent = part;
          container.appendChild(strong);
        } else if (part) {
          container.appendChild(document.createTextNode(part));
        }
      });
    });
  }

  // Renders fenced code blocks (CODE_BUILD_FORMAT's real output shape, e.g.
  // ```html filename="index.html" ... ```) as real <pre> blocks instead of
  // one unreadable run of plain text — the whole point of this page is
  // getting usable code back.
  function renderContent(container, text) {
    const parts = text.split(/```([\w-]*)\s*(?:filename="([^"]*)")?\n?([\s\S]*?)```/g);
    for (let i = 0; i < parts.length; i += 4) {
      if (parts[i]) renderPlainText(container, parts[i]);
      const filename = parts[i + 2];
      const code = parts[i + 3];
      if (code !== undefined) {
        if (filename) {
          const label = document.createElement("div");
          label.style.cssText = "font-size:11px;color:var(--text-muted);margin-top:8px;";
          label.textContent = filename;
          container.appendChild(label);
        }
        const pre = document.createElement("pre");
        pre.className = "schema";
        pre.textContent = code.replace(/\n$/, "");
        container.appendChild(pre);
      }
    }
  }

  function renderMessages(list) {
    messagesEl.innerHTML = "";
    if (!list.length) {
      messagesEl.appendChild(emptyHint);
      return;
    }
    list.forEach((m) => {
      const group = document.createElement("div");
      group.className = `msg-group ${m.role}`;
      const roleLabel = document.createElement("span");
      roleLabel.className = "msg-role";
      roleLabel.textContent = m.role === "user" ? "You" : "NexaAi";
      const bubble = document.createElement("div");
      bubble.className = `msg ${m.role}`;
      renderContent(bubble, m.content);
      group.appendChild(roleLabel);
      group.appendChild(bubble);
      messagesEl.appendChild(group);
    });
    messagesEl.scrollTop = messagesEl.scrollHeight;
  }

  async function loadProjects() {
    const { projects: rows } = await api("/api/projects");
    projects = rows;
    const listEl = document.getElementById("projectList");
    listEl.innerHTML = "";
    if (!rows.length) {
      listEl.innerHTML = `<p class="project-empty">No projects yet — create one above.</p>`;
      return;
    }
    rows.forEach((p) => {
      const item = document.createElement("div");
      item.className = `project-item${p.id === currentProjectId ? " active" : ""}`;
      item.innerHTML = `<div class="info"><div class="title">${p.title}</div><div class="preview">${p.lastMessagePreview ?? "No messages yet"}</div></div>${CHEVRON}`;
      item.addEventListener("click", () => selectProject(p.id, p.title));
      listEl.appendChild(item);
    });
  }

  async function selectProject(id, title) {
    currentProjectId = id;
    currentSessionId = null;
    inputEl.disabled = false;
    sendBtn.disabled = false;
    panelHeaderEl.classList.add("active");
    panelNameEl.textContent = title;
    await loadProjects();
    const { sessions } = await api(`/api/projects/${id}/sessions`);
    if (sessions.length) {
      currentSessionId = sessions[0].id;
      const { messages } = await api(`/api/chat/sessions/${sessions[0].id}/messages`);
      renderMessages(messages);
    } else {
      renderMessages([]);
    }
  }

  document.getElementById("createProjectBtn").addEventListener("click", async () => {
    const title = document.getElementById("newProjectTitle").value.trim();
    if (!title) return;
    errorEl.style.display = "none";
    try {
      const { project } = await api("/api/projects", { method: "POST", body: JSON.stringify({ title }) });
      document.getElementById("newProjectTitle").value = "";
      await selectProject(project.id, project.title);
    } catch (err) {
      showError(err.message);
    }
  });

  // Real Server-Sent Events streaming, same wire format as
  // client/src/lib/api.ts's streamChatMessage — one `data: {...}` JSON
  // object per event, `delta` chunks then a final `done` payload.
  async function sendMessage() {
    const text = inputEl.value.trim();
    if (!text || sending || !currentProjectId) return;
    sending = true;
    errorEl.style.display = "none";
    inputEl.value = "";

    const currentMessages = Array.from(messagesEl.querySelectorAll(".msg")).map((el) => ({
      role: el.classList.contains("user") ? "user" : "assistant",
      content: el.textContent,
    }));
    currentMessages.push({ role: "user", content: text });
    renderMessages(currentMessages);

    const assistantGroup = document.createElement("div");
    assistantGroup.className = "msg-group assistant";
    const assistantRole = document.createElement("span");
    assistantRole.className = "msg-role";
    assistantRole.textContent = "NexaAi";
    const assistantBubble = document.createElement("div");
    assistantBubble.className = "msg assistant";
    assistantGroup.appendChild(assistantRole);
    assistantGroup.appendChild(assistantBubble);
    messagesEl.appendChild(assistantGroup);
    messagesEl.scrollTop = messagesEl.scrollHeight;

    try {
      const token = localStorage.getItem("nexaai_token");
      const response = await fetch(`${API_URL}/api/chat/messages/stream`, {
        method: "POST",
        headers: { "Content-Type": "application/json", ...(token ? { Authorization: `Bearer ${token}` } : {}) },
        body: JSON.stringify({
          sessionId: currentSessionId ?? undefined,
          projectId: currentSessionId ? undefined : currentProjectId,
          text,
          kind: "text",
        }),
      });
      if (!response.ok || !response.body) {
        const body = await response.json().catch(() => null);
        throw new Error(body?.message ?? body?.error ?? `Request failed (${response.status})`);
      }

      const reader = response.body.getReader();
      const decoder = new TextDecoder();
      let buffer = "";
      let assistantText = "";
      while (true) {
        const { done, value } = await reader.read();
        if (done) break;
        buffer += decoder.decode(value, { stream: true });
        let sepIndex = buffer.indexOf("\n\n");
        while (sepIndex !== -1) {
          const rawEvent = buffer.slice(0, sepIndex);
          buffer = buffer.slice(sepIndex + 2);
          const dataLine = rawEvent.split("\n").find((line) => line.startsWith("data: "));
          if (dataLine) {
            const payload = JSON.parse(dataLine.slice("data: ".length));
            if (payload.error) throw new Error(payload.error);
            if (payload.done) {
              currentSessionId = payload.sessionId;
              assistantBubble.innerHTML = "";
              renderContent(assistantBubble, assistantText);
              await loadProjects();
            } else if (typeof payload.delta === "string") {
              assistantText += payload.delta;
              assistantBubble.textContent = assistantText;
              messagesEl.scrollTop = messagesEl.scrollHeight;
            }
          }
          sepIndex = buffer.indexOf("\n\n");
        }
      }
    } catch (err) {
      showError(err.message);
    } finally {
      sending = false;
    }
  }

  sendBtn.addEventListener("click", sendMessage);
  inputEl.addEventListener("keydown", (e) => {
    if (e.key === "Enter" && !e.shiftKey) {
      e.preventDefault();
      sendMessage();
    }
  });

  document.getElementById("logout").addEventListener("click", (e) => {
    e.preventDefault();
    clearToken();
    window.location.href = "./index.html";
  });

  loadProjects();
</script>
