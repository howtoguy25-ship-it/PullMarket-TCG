<title>NexaAi Credits</title>
<link rel="stylesheet" href="./style.css" />
<link rel="icon" type="image/png" href="./favicon.png" />
<div class="wrap">
  <div class="nav">
    <span class="brand"><img src="./favicon.png" alt="" style="width:20px;height:20px;vertical-align:middle;margin-right:6px;border-radius:5px" />NexaAi</span>
    <a href="./build.html">Build</a>
    <a class="active" href="./credits.html">Credits</a>
    <a href="./settings.html">Settings</a>
    <a href="./connectors.html">Connectors</a>
    <a href="./mcp.html">MCP</a>
    <a href="./apikeys.html">Developer</a>
    <a href="./owner.html">Owner</a>
    <a href="#" id="logout">Log out</a>
  </div>

  <div class="card">
    <h1>Balance</h1>
    <div class="balance" id="balance">…</div>
  </div>

  <div class="card">
    <h1>Add credits</h1>
    <h2>Same packs as the app — pick one or enter a custom amount.</h2>
    <div class="pack-grid" id="packGrid"></div>
    <label>Custom amount ($5 minimum)</label>
    <input id="customAmount" type="number" min="5" step="0.01" placeholder="50" />
    <button id="customBuy">Add custom amount</button>
    <p class="error" id="error" style="display:none"></p>
  </div>
</div>
<script src="./api.js"></script>
<script>
  requireLoginOrRedirect();

  async function loadBalance() {
    const { balanceCents, packs } = await api("/api/credits");
    document.getElementById("balance").textContent = `$${(balanceCents / 100).toFixed(2)}`;
    const grid = document.getElementById("packGrid");
    grid.innerHTML = "";
    packs.forEach((pack) => {
      const el = document.createElement("div");
      el.className = "pack";
      el.innerHTML =
        `<div class="amount">${pack.label}</div>` +
        (pack.bonusCents > 0 ? `<div class="bonus">+$${(pack.bonusCents / 100).toFixed(2)} bonus</div>` : "");
      el.addEventListener("click", () => buy({ packLabel: pack.label }));
      grid.appendChild(el);
    });
  }

  const CUSTOM_AMOUNT_MIN_CENTS = 500; // must match checkoutSchema's real min in server/src/routes/credits.ts

  async function buy(body) {
    const errorEl = document.getElementById("error");
    errorEl.style.display = "none";
    try {
      const { checkoutUrl } = await api("/api/credits/checkout", { method: "POST", body: JSON.stringify(body) });
      window.location.href = checkoutUrl;
    } catch (err) {
      errorEl.textContent =
        err.status === 503
          ? "Credit top-ups aren't live yet — the app owner needs to connect a Stripe account (see README)."
          : err.status === 400
            ? `Minimum top-up is $${(CUSTOM_AMOUNT_MIN_CENTS / 100).toFixed(2)}.`
            : err.message;
      errorEl.style.display = "block";
    }
  }

  document.getElementById("customBuy").addEventListener("click", () => {
    const errorEl = document.getElementById("error");
    const amount = parseFloat(document.getElementById("customAmount").value);
    const cents = Math.round(amount * 100);
    if (!(cents >= CUSTOM_AMOUNT_MIN_CENTS)) {
      errorEl.textContent = `Minimum top-up is $${(CUSTOM_AMOUNT_MIN_CENTS / 100).toFixed(2)}.`;
      errorEl.style.display = "block";
      return;
    }
    buy({ customAmountCents: cents });
  });

  document.getElementById("logout").addEventListener("click", (e) => {
    e.preventDefault();
    clearToken();
    window.location.href = "./index.html";
  });

  loadBalance();
</script>
