<title>Reset your password — NexaAi</title>
<link rel="stylesheet" href="./style.css" />
<link rel="icon" type="image/png" href="./favicon.png" />
<div class="wrap" style="max-width: 420px; padding-top: 64px">
  <div class="nav" style="margin-bottom: 40px; justify-content: center">
    <span class="brand"><img src="./favicon.png" alt="" style="width:20px;height:20px;vertical-align:middle;margin-right:6px;border-radius:5px" />NexaAi</span>
  </div>

  <div class="card" id="formCard">
    <h1>Reset your password</h1>
    <h2 id="subhead">Choose a new password for your account.</h2>

    <label>New password</label>
    <input id="newPassword" type="password" autocomplete="new-password" placeholder="At least 8 characters" />

    <label>Confirm new password</label>
    <input id="confirmPassword" type="password" autocomplete="new-password" placeholder="Type it again" />

    <button id="submit">Set new password</button>
    <p class="error" id="error" style="display:none"></p>
  </div>

  <div class="card" id="successCard" style="display:none; text-align: center">
    <h1>Password updated</h1>
    <h2>You can go back to the NexaAi app and log in with your new password.</h2>
  </div>

  <div class="card" id="invalidCard" style="display:none; text-align: center">
    <h1>Link invalid or expired</h1>
    <h2>Reset links only work for 30 minutes. Go back to the app and tap "Forgot password?" again to get a new one.</h2>
  </div>
</div>
<script src="./api.js"></script>
<script>
  const params = new URLSearchParams(window.location.search);
  const token = params.get("token");
  const email = params.get("email");

  if (!token || !email) {
    document.getElementById("formCard").style.display = "none";
    document.getElementById("invalidCard").style.display = "block";
  }

  document.getElementById("submit").addEventListener("click", async () => {
    const errorEl = document.getElementById("error");
    errorEl.style.display = "none";
    const newPassword = document.getElementById("newPassword").value;
    const confirmPassword = document.getElementById("confirmPassword").value;

    if (newPassword.length < 8) {
      errorEl.textContent = "Password must be at least 8 characters.";
      errorEl.style.display = "block";
      return;
    }
    if (newPassword !== confirmPassword) {
      errorEl.textContent = "Those passwords don't match.";
      errorEl.style.display = "block";
      return;
    }

    try {
      await api("/api/auth/reset-password", { method: "POST", body: JSON.stringify({ email, token, newPassword }) });
      document.getElementById("formCard").style.display = "none";
      document.getElementById("successCard").style.display = "block";
    } catch (err) {
      if (err.status === 400 && err.body && err.body.error === "invalid_or_expired") {
        document.getElementById("formCard").style.display = "none";
        document.getElementById("invalidCard").style.display = "block";
        return;
      }
      errorEl.textContent = err.message;
      errorEl.style.display = "block";
    }
  });
</script>
