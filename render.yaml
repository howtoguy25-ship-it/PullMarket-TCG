databases:
  - name: pullmarket-tcg-db
    plan: free
    databaseName: pullmarket_tcg
    user: pullmarket_tcg

services:
  - type: web
    name: pullmarket-tcg
    runtime: node
    plan: free
    region: oregon
    # preDeployCommand isn't available on Render's free plan, so the DB
    # migration runs as the last build step instead (still runs before the
    # new version goes live, just not in its own isolated pre-deploy phase).
    # --include=dev is required: NODE_ENV=production (set below) makes plain
    # `npm install` skip devDependencies, but babel-plugin-module-resolver,
    # esbuild, and drizzle-kit (all devDependencies) are needed to run this
    # build itself.
    buildCommand: npm install --include=dev && npm run web:build && npm run server:build && npm run db:pre-push && npm run db:push
    startCommand: npm run server:start
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: DATABASE_URL
        fromDatabase:
          name: pullmarket-tcg-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: OWNER_PHONE_NUMBER
        value: "+61474011265"
      - key: PLATFORM_FEE_CENTS
        value: "200"
      # These two need the URL Render assigns this service on first deploy
      # (visible at the top of the service dashboard, looks like
      # https://pullmarket-tcg.onrender.com). Paste it into both after the
      # first deploy finishes, then trigger a manual redeploy.
      - key: APP_BASE_URL
        sync: false
      - key: EXPO_PUBLIC_API_URL
        sync: false
      # Fill these in via the Render dashboard (Environment tab) once you
      # have real values — see README.md "Setup steps" for where each one
      # comes from. Until set, the app degrades gracefully (OTP codes log
      # instead of sending, Stripe endpoints return a clear "not configured"
      # message) rather than failing silently.
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: EXPO_PUBLIC_STRIPE_PUBLISHABLE_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
      - key: VONAGE_API_KEY
        sync: false
      - key: VONAGE_API_SECRET
        sync: false
      - key: VONAGE_FROM
        value: PullMarket
      - key: TWILIO_ACCOUNT_SID
        sync: false
      - key: TWILIO_AUTH_TOKEN
        sync: false
      - key: TWILIO_FROM_NUMBER
        sync: false
      # Resend (https://resend.com), not SMTP — Render blocks outbound SMTP
      # ports, so raw SMTP fails with a connection timeout no matter the
      # provider/credentials. Get an API key from Resend's dashboard.
      - key: RESEND_API_KEY
        sync: false
      # Sending "from" pullmarkettcg.com requires that domain to be
      # verified in Resend's dashboard (Domains > Add Domain > add the
      # DKIM/SPF/DMARC records it gives you) — until it's verified, Resend
      # will reject every send with a "domain not verified" error and OTP
      # emails will silently stop delivering. Verify the domain first, or
      # temporarily fall back to the default onboarding@resend.dev sender.
      - key: SMTP_FROM
        value: "PullMarket TCG <Sales@pullmarkettcg.com>"
      - key: OWNER_REPORT_EMAIL
        sync: false
      - key: GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: EXPO_PUBLIC_GOOGLE_WEB_CLIENT_ID
        sync: false
      - key: GOOGLE_CLIENT_SECRET
        sync: false
      - key: EXPO_PUBLIC_APPLE_SERVICES_ID
        value: com.pullmarket.tcg.web
      # Server-side counterparts of the client's EXPO_PUBLIC_APPLE_IAP_*
      # vars (set in eas.json/scripts/eas-update-production.sh) — those let
      # the app FIND and show the purchase button via StoreKit; these let
      # the server VERIFY the purchase afterwards against Apple's signed
      # transaction data (see lib/appleSubscription.ts). Both product ids
      # are public (they're baked into the client bundle anyway), so it's
      # safe to commit the actual values here rather than sync: false.
      - key: APPLE_IAP_PRODUCT_ID
        value: com.pullmarket.tcg.pro_monthly
      - key: APPLE_IAP_REMOVE_ADS_PRODUCT_ID
        value: com.pullmarket.tcg.remove_ads
      # Optional — powers real-time AI chat moderation (scam/harassment
      # detection, see server/src/lib/moderation.ts) AND the in-app AI help
      # assistant (Profile > Support > AI Help Assistant, see
      # server/src/routes/help.ts). Get a key from
      # https://console.anthropic.com. Without it, moderation is simply
      # skipped and the help assistant returns a clear "not configured"
      # message — nothing else breaks.
      - key: ANTHROPIC_API_KEY
        sync: false
      # Strongly recommended on Render specifically: this service's local
      # disk is wiped on every deploy/restart (free/starter plan), so any
      # uploaded avatar/listing photo/chat media/card composite is lost
      # until re-uploaded unless these are set. Points every upload at
      # S3-compatible object storage instead — see .env.example for the
      # full explanation and provider-specific notes (R2 recommended).
      - key: S3_BUCKET
        sync: false
      - key: S3_ACCESS_KEY_ID
        sync: false
      - key: S3_SECRET_ACCESS_KEY
        sync: false
      - key: S3_REGION
        value: auto
      - key: S3_ENDPOINT
        sync: false
      - key: S3_PUBLIC_URL_BASE
        sync: false
      # Optional — powers the Prices tab (live Pokémon/One Piece TCG market
      # prices via justtcg.com). Requires a paid JustTCG plan for
      # commercial use — see .env.example. Without it, the Prices tab shows
      # a clear "not configured" message instead of failing.
      - key: JUSTTCG_API_KEY
        sync: false
